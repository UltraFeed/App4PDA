name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      version:
        description: App version of the signed APK
        value: ${{ jobs.sign.outputs.version }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  checks:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-37.1 build-tools;37.0.0 ndk;28.2.13676358'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Test, lint, Detekt, Spotless, debug APK
        run: ./gradlew verifyDebug --continue --build-cache --no-configuration-cache

      - name: Stop Gradle
        if: ${{ always() }}
        run: ./gradlew --stop

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() && hashFiles('app/build/outputs/apk/debug/*.apk') != '' }}
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: verification
          path: |
            app/build/test-results/
            app/build/reports/
            build/reports/
            build/spotless/
          include-hidden-files: true
          retention-days: 14

  sign:
    needs: checks
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    environment: release
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-37.1 build-tools;37.0.0 ndk;28.2.13676358'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Restore signing keystore
        id: keystore
        uses: timheuer/base64-to-file@dfa5a5dd38803cb4f5c3a081eeb28e8362d43e9c # v2
        with:
          fileName: release.keystore
          encodedString: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}

      - name: Build signed APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ steps.keystore.outputs.filePath }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --build-cache --no-configuration-cache

      - name: Stop Gradle
        if: ${{ always() }}
        run: ./gradlew --stop

      - name: Read version
        id: version
        run: |
          version="$(sed -n 's/^app\.versionName=//p' gradle.properties)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signed-apk
          path: app/build/outputs/apk/release/app-release.apk
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: release-diagnostics
          path: |
            app/build/outputs/mapping/release/
            app/build/reports/
          retention-days: 30
