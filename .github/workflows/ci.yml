name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      version:
        description: Signed APK version
        value: ${{ jobs.signed.outputs.version }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  checks:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Test, lint, Detekt, Spotless, debug APK
        run: >-
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:detektDebug
          spotlessCheck :app:assembleDebug --continue --no-build-cache --no-configuration-cache

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: ${{ success() && (github.event_name == 'push' || github.event_name == 'pull_request') }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          path: |
            app/build/outputs/apk/debug/*.apk
            build/app/outputs/apk/debug/*.apk
          archive: false
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: verification
          path: |
            app/build/test-results/
            app/build/reports/
            build/app/test-results/
            build/app/reports/
            build/reports/
            build/spotless/
          include-hidden-files: true
          retention-days: 14

  signed:
    needs: checks
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0 ndk;28.2.13676358'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-disabled: true
          dependency-graph: ${{ github.event_name == 'push' && 'generate-and-submit' || 'disabled' }}

      - name: Restore signing keystore
        id: keystore
        uses: timheuer/base64-to-file@dfa5a5dd38803cb4f5c3a081eeb28e8362d43e9c # v2
        with:
          fileName: release.keystore
          encodedString: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}

      - name: Build signed APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ steps.keystore.outputs.filePath }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Name signed APK
        id: version
        run: |
          version="$(sed -n 's/^app\.versionName=//p' gradle.properties)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/App4PDA-$version.apk"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: app/build/outputs/apk/release/App4PDA-*.apk
          archive: false
          if-no-files-found: error
          retention-days: 30
