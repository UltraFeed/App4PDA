name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  publish:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Reject an existing release tag
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        with:
          script: |
            const ref = `tags/v${process.env.RELEASE_VERSION}`;
            try {
              await github.rest.git.getRef({ ...context.repo, ref });
              core.setFailed(`Release tag already exists: ${ref}`);
            } catch (error) {
              if (error.status !== 404) throw error;
            }

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-apk
          path: dist

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: App4PDA v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          draft: false
          fail_on_unmatched_files: true
          files: dist/app-release.apk
